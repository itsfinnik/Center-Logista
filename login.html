<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | Центр-Инвест</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255,255,255,0.18);
            animation: slideInUp 0.5s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-title {
            color: white;
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-divider {
            height: 2px;
            background: white;
            margin: 30px 0;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: white;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            color: #333;
        }

        .form-input::placeholder {
            color: #bbb;
        }

        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 14px;
            margin-top: 15px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: white;
            color: #11998e;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .auth-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.3);
            flex-wrap: wrap;
            gap: 15px;
        }

        .auth-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .auth-container {
                padding: 30px 25px;
                border-radius: 15px;
            }

            .auth-title {
                font-size: 26px;
            }

            .auth-subtitle {
                font-size: 14px;
            }

            .auth-divider {
                margin: 20px 0;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-label {
                font-size: 14px;
            }

            .form-input {
                padding: 14px 18px;
                font-size: 14px;
            }

            .auth-button {
                padding: 14px;
                font-size: 15px;
            }

            .auth-footer {
                font-size: 14px;
            }

            .auth-link {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .auth-container {
                padding: 25px 20px;
                border-radius: 12px;
            }

            .auth-title {
                font-size: 22px;
            }

            .auth-subtitle {
                font-size: 13px;
            }

            .auth-divider {
                margin: 15px 0;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .form-label {
                font-size: 13px;
                margin-bottom: 8px;
            }

            .form-input {
                padding: 12px 16px;
                font-size: 13px;
            }

            .auth-button {
                padding: 12px;
                font-size: 14px;
            }

            .auth-footer {
                font-size: 13px;
            }

            .auth-link {
                font-size: 13px;
            }

            .remember-me {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1 class="auth-title">Авторизация</h1>
        <div class="auth-divider"></div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Электронная почта/номер телефона</label>
                <input type="text" id="login" class="form-input" placeholder="Введите номер телефона или почту..." required>
            </div>

            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" id="password" class="form-input" placeholder="Введите пароль..." required>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Запомнить меня</label>
            </div>

            <div id="errorMessage" style="display: none; color: white; background: rgba(255,0,0,0.2); padding: 12px; border-radius: 8px; margin-top: 15px;"></div>

            <button type="submit" class="submit-btn">Войти</button>
        </form>

        <div class="auth-links">
            <a href="#" class="auth-link">Восстановить пароль</a>
            <span style="color: rgba(255,255,255,0.5);">/</span>
            <a href="/register.html" class="auth-link">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = event.target.querySelector('.submit-btn');
            
            // Скрываем ошибку
            errorDiv.style.display = 'none';
            
            // Блокируем кнопку
            submitBtn.disabled = true;
            submitBtn.textContent = 'Вход...';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        login: login,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Ошибка авторизации');
                }
                
                // Сохраняем токен
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Успешная авторизация - переход на приложение
                window.location.href = '/app.html';
                
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        }
    </script>
</body>
</html>
