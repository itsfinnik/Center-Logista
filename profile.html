<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Центр-Инвест</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 40px;
            color: white;
            text-align: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            color: white;
            margin: 0 auto 20px;
            border: 4px solid white;
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-email {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .profile-body {
            padding: 40px;
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .profile-section-title {
            font-size: 20px;
            font-weight: 600;
            color: #11998e;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .profile-info-item {
            background: #f8f9fd;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #11998e;
        }

        .profile-info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .profile-info-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: white;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-back {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-logout {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">
                <!-- Инициалы -->
            </div>
            <div class="profile-name" id="profileName"></div>
            <div class="profile-email" id="profileEmail"></div>
        </div>

        <div class="profile-body">
            <div class="profile-section">
                <div class="profile-section-title">
                    Основная информация
                </div>
                <div class="profile-info-grid">
                    <div class="profile-info-item">
                        <div class="profile-info-label">Email</div>
                        <div class="profile-info-value" id="infoEmail"></div>
                    </div>
                    <div class="profile-info-item">
                        <div class="profile-info-label">Телефон</div>
                        <div class="profile-info-value" id="infoPhone"></div>
                    </div>
                    <div class="profile-info-item">
                        <div class="profile-info-label">Дата регистрации</div>
                        <div class="profile-info-value" id="infoDate"></div>
                    </div>
                </div>
            </div>

            <div class="profile-section">
                <div class="profile-section-title">
                    Статистика
                </div>
                <div class="profile-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="statRoutes">0</div>
                        <div class="stat-label">Маршрутов построено</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statClients">0</div>
                        <div class="stat-label">Клиентов посещено</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statDistance">0</div>
                        <div class="stat-label">Км пройдено</div>
                    </div>
                </div>
            </div>

            <div class="actions">
                <a href="/app.html" class="btn-back">← Вернуться к маршрутам</a>
                <button class="btn-logout" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <script>
        // Проверка авторизации
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('access_token');
            const userStr = localStorage.getItem('user');
            
            if (!token || !userStr) {
                // Если не авторизован - редирект на логин
                window.location.href = '/login.html';
                return;
            }

            try {
                const user = JSON.parse(userStr);
                displayUserInfo(user);
            } catch (e) {
                window.location.href = '/login.html';
            }
        });

        function displayUserInfo(user) {
            // Инициалы
            const nameParts = user.email.split('@')[0].split('.');
            const initials = nameParts.map(p => p[0].toUpperCase()).join('');
            document.getElementById('profileAvatar').textContent = initials.slice(0, 2);
            
            // Имя
            const name = nameParts.join(' ') || user.email.split('@')[0];
            document.getElementById('profileName').textContent = name.toUpperCase();
            
            // Email
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('infoEmail').textContent = user.email;
            
            // Телефон
            document.getElementById('infoPhone').textContent = user.phone || 'Не указан';
            
            // Дата регистрации
            const createdDate = user.created_at ? new Date(user.created_at).toLocaleDateString('ru-RU') : 'Н/Д';
            document.getElementById('infoDate').textContent = createdDate;
            
            // Загружаем статистику
            loadUserStats();
        }

        async function loadUserStats() {
            try {
                const token = localStorage.getItem('access_token');
                
                const response = await fetch('/api/stats/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    console.error('Ошибка загрузки статистики');
                    return;
                }
                
                const data = await response.json();
                const stats = data.stats;
                
                // Обновляем статистику с анимацией
                animateValue('statRoutes', 0, stats.routes_count, 1000);
                animateValue('statClients', 0, stats.clients_visited, 1000);
                animateValue('statDistance', 0, stats.total_distance, 1000, true);
                
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }

        function animateValue(id, start, end, duration, isDecimal = false) {
            const element = document.getElementById(id);
            const range = end - start;
            const increment = range / (duration / 16);
            let current = start;
            
            const timer = setInterval(() => {
                current += increment;
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    current = end;
                    clearInterval(timer);
                }
                element.textContent = isDecimal ? current.toFixed(1) : Math.floor(current);
            }, 16);
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
    </script>
</body>
</html>
