<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Центр-Инвест</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255,255,255,0.18);
            animation: slideInUp 0.5s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-title {
            color: white;
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-divider {
            height: 2px;
            background: white;
            margin: 30px 0;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: white;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            color: #333;
        }

        .form-input::placeholder {
            color: #bbb;
        }

        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: white;
            color: #11998e;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .auth-links {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }

        .auth-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .helper-text {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1 class="auth-title">Регистрация</h1>
        <div class="auth-divider"></div>
        
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label">Введите вашу электронную почту</label>
                <input type="email" id="email" class="form-input" placeholder="Введите электронную почту..." required>
            </div>

            <div class="form-group">
                <label class="form-label">Введите ваш номер телефона</label>
                <input type="tel" id="phone" class="form-input" placeholder="Введите номер телефона..." required pattern="[0-9+\-\(\) ]+">
            </div>

            <div class="form-group">
                <label class="form-label">Придумайте пароль</label>
                <p class="helper-text">(доступные символы: A-Z, цифры и "_")</p>
                <input type="password" id="password" class="form-input" placeholder="Введите пароль..." required minlength="6" pattern="[A-Za-z0-9_]+">
            </div>

            <div id="errorMessage" style="display: none; color: white; background: rgba(255,0,0,0.2); padding: 12px; border-radius: 8px; margin-top: 15px;"></div>

            <button type="submit" class="submit-btn">Зарегистрироваться</button>
        </form>

        <div class="auth-links">
            <span style="color: white;">Уже есть аккаунт?</span>
            &nbsp;&nbsp;
            <a href="/login.html" class="auth-link">Войти</a>
        </div>
    </div>

    <script>
        async function handleRegister(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = event.target.querySelector('.submit-btn');
            
            // Скрываем ошибку
            errorDiv.style.display = 'none';
            
            // Блокируем кнопку
            submitBtn.disabled = true;
            submitBtn.textContent = 'Регистрация...';
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        phone: phone,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Ошибка регистрации');
                }
                
                // Сохраняем токен
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Успешная регистрация - переход на приложение
                alert('Регистрация успешна! Добро пожаловать!');
                window.location.href = '/app.html';
                
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Зарегистрироваться';
            }
        }
    </script>
</body>
</html>
