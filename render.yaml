services:
  - type: web
    name: route-planning-system
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: APP_NAME
        value: Route Planning System
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO

